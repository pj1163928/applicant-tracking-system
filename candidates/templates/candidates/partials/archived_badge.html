{% comment %}
The "Archived" badge on an archived candidate, wherever they're listed. Pass
`small=True` for the extra-small size used on board cards.
{% endcomment %}
<span class="badge {% if small %}badge-xs{% else %}badge-sm{% endif %} badge-neutral badge-soft gap-1" data-testid="archived-badge">{% icon "archive" "size-3" %} Archived</span>
