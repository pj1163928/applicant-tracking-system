{% load static stylesheets %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Applicant Tracking{% endblock %} · ATS</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/logo.svg' %}">
  <script>
    // Apply the saved theme before the page paints, so there is no flash.
    try {
      const saved = localStorage.getItem("theme");
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
  {# Versioned by its build, so no browser keeps an old copy (see config/templatetags/stylesheets.py). #}
  {% tailwind_stylesheet %}
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>
<body class="min-h-screen bg-base-200 text-base-content antialiased transition-colors duration-300" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <a href="#main" class="btn btn-primary btn-sm sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50">Skip to content</a>
  {% block body %}{% endblock %}

  <script>
    // Light/dark toggle: corporate is light, business is dark. Remembered per browser.
    (function () {
      const root = document.documentElement;
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const toggles = document.querySelectorAll(".js-theme-toggle");
      const current = root.dataset.theme || (prefersDark ? "business" : "corporate");
      toggles.forEach(function (toggle) {
        toggle.checked = current === "business";
        toggle.addEventListener("change", function () {
          const theme = toggle.checked ? "business" : "corporate";
          root.dataset.theme = theme;
          toggles.forEach(function (other) { other.checked = toggle.checked; });
          try { localStorage.setItem("theme", theme); } catch (e) {}
        });
      });
    })();
  </script>
</body>
</html>
